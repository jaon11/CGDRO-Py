[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CGDRO"
version = "0.1.0"
description = "Conditional Group Distributionally Robust Optimization (CGDRO) toolkit, providing conprehensive multi-source prediction and model statistical inference without knowing target labels, offering multi-source solutions to low-dimensional and high-dimensional, linear and complex data, regression and classification problems."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Ziang Fu", email = "ziangfu@tamu.edu" },
    { name = "Zhenyu Wang", email = "zw425@stat.rutgers.edu"},
    { name = "Zijian Guo", email = "zijguo@zju.edu.cn"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
keywords = ["distributionally-robust-optimization", "domain-adaptation", "machine-learning"]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "cvxpy>=1.3",
    "xgboost>=1.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black>=23",
    "ruff>=0.1"
]
examples = [
    "jupyter>=1"
]

[tool.setuptools]
packages = ["cgdro"]

[tool.setuptools.dynamic]
version = { attr = "cgdro.__version__" }